name: Build APK

# Cara menjalankan dari HP: buka tab Actions di repo -> pilih "Build APK" ->
# tekan "Run workflow". Hasilnya ada di bagian Artifacts di halaman run tersebut.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true bila keystore release sudah disimpan di GitHub Secrets (opsional)
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Ambil source dari repo
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan source proyek
        run: |
          # Proyek bisa berada di root repo, di subfolder, atau berupa satu file ZIP di root repo.
          GRADLEW=$(find . -maxdepth 3 -name gradlew -not -path './build_src/*' | head -n 1)
          if [ -z "$GRADLEW" ]; then
            ZIP=$(ls ./*.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Tidak ditemukan gradlew maupun file ZIP proyek di repo."
              exit 1
            fi
            echo "Mengekstrak $ZIP"
            mkdir build_src
            unzip -q "$ZIP" -d build_src
            GRADLEW=$(find build_src -maxdepth 3 -name gradlew | head -n 1)
          fi
          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan di dalam proyek."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
          echo "Folder proyek: $(dirname "$GRADLEW")"

      - name: Build APK debug
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build APK release (hanya bila keystore tersedia)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CBT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CBT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CBT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export CBT_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$CBT_KEYSTORE_FILE"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Kumpulkan APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk dist/CBT-SMKN14-Exambrowser-0.2.2-beta-debug.apk
          if ls "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk dist/CBT-SMKN14-Exambrowser-0.2.2-beta-release.apk
          fi
          ls -la dist

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: CBT-SMKN14-Exambrowser-APK
          path: dist/*.apk
          if-no-files-found: error
